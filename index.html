<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Voice Agent</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #status { font-size: 20px; margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
        .config-section { max-width: 400px; margin: 20px auto; text-align: left; }
        .config-row { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Zavis Voice Employee</h1>
    
    <div class="config-section">
        <div class="config-row">
            <label for="model-select">AI Model:</label>
            <select id="model-select">
                <option value="gemini_live_llm">Gemini Live</option>
                <option value="openai_realtime_llm">OpenAI Realtime</option>
            </select>
        </div>
        
        <div class="config-row">
            <label for="voice-select">Voice:</label>
            <select id="voice-select">
                <option value="Puck">Puck</option>
                <option value="Aoede">Aoede</option>
                <option value="Charon">Charon</option>
                <option value="Fenrir">Fenrir</option>
                <option value="Kore">Kore</option>
            </select>
        </div>
    </div>
    
    <p id="status">Disconnected</p>
    <button id="connect-btn">Connect</button>
    <audio id="audio-el" autoplay></audio>

    <script>
        const statusEl = document.getElementById("status")
        const buttonEl = document.getElementById("connect-btn")
        const audioEl = document.getElementById("audio-el")
        const modelSelect = document.getElementById("model-select")
        const voiceSelect = document.getElementById("voice-select")

        let connected = false
        let peerConnection = null
        
        // Update voice options based on selected model
        const updateVoiceOptions = () => {
            const model = modelSelect.value
            voiceSelect.innerHTML = ''
            
            if (model === 'gemini_live_llm') {
                const geminiVoices = ['Puck', 'Aoede', 'Charon', 'Fenrir', 'Kore']
                geminiVoices.forEach(voice => {
                    const option = document.createElement('option')
                    option.value = voice
                    option.textContent = voice
                    voiceSelect.appendChild(option)
                })
            } else if (model === 'openai_realtime_llm') {
                const openaiVoices = ['alloy', 'echo', 'shimmer', 'ash', 'ballad', 'coral', 'sage', 'verse']
                openaiVoices.forEach(voice => {
                    const option = document.createElement('option')
                    option.value = voice
                    option.textContent = voice.charAt(0).toUpperCase() + voice.slice(1)
                    voiceSelect.appendChild(option)
                })
            }
        }
        
        modelSelect.addEventListener('change', updateVoiceOptions)
        updateVoiceOptions() // Initialize on load

        const waitForIceGatheringComplete = async (pc, timeoutMs = 2000) => {
            if (pc.iceGatheringState === 'complete') return;
            console.log("Waiting for ICE gathering to complete. Current state:", pc.iceGatheringState);
            return new Promise((resolve) => {
                let timeoutId;
                const checkState = () => {
                    console.log("icegatheringstatechange:", pc.iceGatheringState);
                    if (pc.iceGatheringState === 'complete') {
                        cleanup();
                        resolve();
                    }
                };
                const onTimeout = () => {
                    console.warn(`ICE gathering timed out after ${timeoutMs} ms.`);
                    cleanup();
                    resolve();
                };
                const cleanup = () => {
                    pc.removeEventListener('icegatheringstatechange', checkState);
                    clearTimeout(timeoutId);
                };
                pc.addEventListener('icegatheringstatechange', checkState);
                timeoutId = setTimeout(onTimeout, timeoutMs);
                // Checking the state again to avoid any eventual race condition
                checkState();
            });
        };


        const createSmallWebRTCConnection = async (audioTrack) => {
            const config = {
              iceServers: [],
            };
            const pc = new RTCPeerConnection(config)
            addPeerConnectionEventListeners(pc)
            pc.ontrack = e => audioEl.srcObject = e.streams[0]
            // SmallWebRTCTransport expects to receive both transceivers
            pc.addTransceiver(audioTrack, { direction: 'sendrecv' })
            pc.addTransceiver('video', { direction: 'sendrecv' })
            await pc.setLocalDescription(await pc.createOffer())
            await waitForIceGatheringComplete(pc)
            const offer = pc.localDescription
            const selectedModel = modelSelect.value
            const selectedVoice = voiceSelect.value
            const response = await fetch('/api/offer', {
                body: JSON.stringify({ 
                    sdp: offer.sdp, 
                    type: offer.type,
                    model: selectedModel,
                    voice: selectedVoice
                }),
                headers: { 'Content-Type': 'application/json' },
                method: 'POST',
            });
            const answer = await response.json()
            await pc.setRemoteDescription(answer)
            return pc
        }

        const connect = async () => {
            _onConnecting()
            const audioStream = await navigator.mediaDevices.getUserMedia({audio: true})
            peerConnection= await createSmallWebRTCConnection(audioStream.getAudioTracks()[0])
        }

        const addPeerConnectionEventListeners = (pc) => {
            pc.oniceconnectionstatechange = () => {
                console.log("oniceconnectionstatechange", pc?.iceConnectionState)
            }
            pc.onconnectionstatechange = () => {
                console.log("onconnectionstatechange", pc?.connectionState)
                let connectionState = pc?.connectionState
                if (connectionState === 'connected') {
                    _onConnected()
                } else if (connectionState === 'disconnected') {
                    _onDisconnected()
                }
            }
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log("New ICE candidate:", event.candidate);
                } else {
                    console.log("All ICE candidates have been sent.");
                }
            };
        }

        const _onConnecting = () => {
            statusEl.textContent = "Connecting"
            buttonEl.textContent = "Disconnect"
            connected = true
        }

        const _onConnected = () => {
            statusEl.textContent = "Connected"
            buttonEl.textContent = "Disconnect"
            connected = true
        }

        const _onDisconnected = () => {
            statusEl.textContent = "Disconnected"
            buttonEl.textContent = "Connect"
            connected = false
        }

        const disconnect = () => {
            if (!peerConnection) {
                return
            }
            peerConnection.close()
            peerConnection = null
            _onDisconnected()
        }

        buttonEl.addEventListener("click", async () => {
            if (!connected) {
                await connect()
            } else {
                disconnect()
            }
        });
    </script>
</body>
</html>
