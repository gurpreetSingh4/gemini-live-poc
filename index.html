<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Voice Agent</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #status { font-size: 20px; margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        .config-section { max-width: 400px; margin: 20px auto; text-align: left; }
        .config-row { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 8px; font-size: 14px; }
        .button-group { margin: 20px 0; }
        .appointment-btn { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .appointment-btn:hover { background-color: #45a049; }
        .general-btn { background-color: #008CBA; color: white; border: none; cursor: pointer; }
        .general-btn:hover { background-color: #007399; }
        .disconnect-btn { background-color: #f44336; color: white; border: none; cursor: pointer; }
        .disconnect-btn:hover { background-color: #da190b; }
    </style>
</head>
<body>
    <h1>Zavis Voice Employee</h1>
    
    <div id="server-info" style="font-size: 12px; color: #666; margin: 10px 0;"></div>
    
    <div class="config-section">
        <div class="config-row">
            <label for="model-select">AI Model:</label>
            <select id="model-select">
                <option value="gemini_live_llm">Gemini Live</option>
                <option value="openai_realtime_llm">OpenAI Realtime</option>
                <option value="gemini_vertex_llm">Gemini Vertex</option>
            </select>
        </div>
        
        <div class="config-row">
            <label for="voice-select">Voice:</label>
            <select id="voice-select">
                <option value="Puck">Puck</option>
                <option value="Aoede">Aoede</option>
                <option value="Charon">Charon</option>
                <option value="Fenrir">Fenrir</option>
                <option value="Kore">Kore</option>
            </select>
        </div>
    </div>
    
    <p id="status">Disconnected</p>
    
    <div class="button-group">
        <button id="connect-btn" class="general-btn">Connect (General Assistant)</button>
        <button id="appointment-btn" class="appointment-btn">Book Appointment</button>
    </div>
    
    <audio id="audio-el" autoplay></audio>

    <script>
        // Configuration: Set your server URL here
        // If empty, it will use the same origin (for production)
        // For development with different ports, set explicitly
        const SERVER_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5502'  // Development server port
            : '';  // Production: same origin
        
        const effectiveServerUrl = SERVER_URL || window.location.origin;
        console.log('Server URL:', effectiveServerUrl);
        
        // Display server info
        document.getElementById('server-info').textContent = 
            `Server: ${effectiveServerUrl} | Served from: ${window.location.origin}`;

        const statusEl = document.getElementById("status")
        const buttonEl = document.getElementById("connect-btn")
        const appointmentBtn = document.getElementById("appointment-btn")
        const audioEl = document.getElementById("audio-el")
        const modelSelect = document.getElementById("model-select")
        const voiceSelect = document.getElementById("voice-select")

        let connected = false
        let peerConnection = null
        let currentMode = null // 'general' or 'appointment'
        
        // Update voice options based on selected model
        const updateVoiceOptions = () => {
            const model = modelSelect.value
            voiceSelect.innerHTML = ''
            
            if (model === 'gemini_live_llm') {
                const geminiVoices = ['Puck', 'Aoede', 'Charon', 'Fenrir', 'Kore']
                geminiVoices.forEach(voice => {
                    const option = document.createElement('option')
                    option.value = voice
                    option.textContent = voice
                    voiceSelect.appendChild(option)
                })
            } else if (model === 'openai_realtime_llm') {
                const openaiVoices = ['alloy', 'echo', 'shimmer', 'ash', 'ballad', 'coral', 'sage', 'verse']
                openaiVoices.forEach(voice => {
                    const option = document.createElement('option')
                    option.value = voice
                    option.textContent = voice.charAt(0).toUpperCase() + voice.slice(1)
                    voiceSelect.appendChild(option)
                })
            } else if (model === 'gemini_vertex_llm') {
                const geminiVoices = ['Puck', 'Aoede', 'Charon', 'Fenrir', 'Kore']
                geminiVoices.forEach(voice => {
                    const option = document.createElement('option')
                    option.value = voice
                    option.textContent = voice
                    voiceSelect.appendChild(option)
                })
            }
        }
        
        modelSelect.addEventListener('change', updateVoiceOptions)
        updateVoiceOptions() // Initialize on load

        const waitForIceGatheringComplete = async (pc, timeoutMs = 2000) => {
            if (pc.iceGatheringState === 'complete') return;
            console.log("Waiting for ICE gathering to complete. Current state:", pc.iceGatheringState);
            return new Promise((resolve) => {
                let timeoutId;
                const checkState = () => {
                    console.log("icegatheringstatechange:", pc.iceGatheringState);
                    if (pc.iceGatheringState === 'complete') {
                        cleanup();
                        resolve();
                    }
                };
                const onTimeout = () => {
                    console.warn(`ICE gathering timed out after ${timeoutMs} ms.`);
                    cleanup();
                    resolve();
                };
                const cleanup = () => {
                    pc.removeEventListener('icegatheringstatechange', checkState);
                    clearTimeout(timeoutId);
                };
                pc.addEventListener('icegatheringstatechange', checkState);
                timeoutId = setTimeout(onTimeout, timeoutMs);
                // Checking the state again to avoid any eventual race condition
                checkState();
            });
        };


        const createSmallWebRTCConnection = async (audioTrack, mode) => {
            const config = {
              iceServers: [
                  // STUN servers for NAT traversal
                  { urls: 'stun:stun.l.google.com:19302' },
                  { urls: 'stun:stun1.l.google.com:19302' },
                  // TURN servers for connection relay (critical for Railway/cloud deployments)
                  { 
                      urls: 'turn:openrelay.metered.ca:80',
                      username: 'openrelayproject',
                      credential: 'openrelayproject'
                  },
                  { 
                      urls: 'turn:openrelay.metered.ca:443',
                      username: 'openrelayproject',
                      credential: 'openrelayproject'
                  },
                  { 
                      urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                      username: 'openrelayproject',
                      credential: 'openrelayproject'
                  }
              ],
            };
            const pc = new RTCPeerConnection(config)
            addPeerConnectionEventListeners(pc)
            pc.ontrack = e => audioEl.srcObject = e.streams[0]
            // SmallWebRTCTransport expects to receive both transceivers
            pc.addTransceiver(audioTrack, { direction: 'sendrecv' })
            pc.addTransceiver('video', { direction: 'sendrecv' })
            await pc.setLocalDescription(await pc.createOffer())
            await waitForIceGatheringComplete(pc)
            const offer = pc.localDescription
            const selectedModel = modelSelect.value
            const selectedVoice = voiceSelect.value
            
            // Use configured server URL or same origin
            const apiUrl = SERVER_URL ? `${SERVER_URL}/api/offer` : '/api/offer';
            
            const response = await fetch(apiUrl, {
                body: JSON.stringify({ 
                    sdp: offer.sdp, 
                    type: offer.type,
                    model: selectedModel,
                    voice: selectedVoice,
                    mode: mode  // 'general' or 'appointment'
                }),
                headers: { 'Content-Type': 'application/json' },
                method: 'POST',
            });
            const answer = await response.json()
            await pc.setRemoteDescription(answer)
            return pc
        }

        const connect = async (mode) => {
            _onConnecting(mode)
            const audioStream = await navigator.mediaDevices.getUserMedia({audio: true})
            peerConnection = await createSmallWebRTCConnection(audioStream.getAudioTracks()[0], mode)
            currentMode = mode
        }

        const addPeerConnectionEventListeners = (pc) => {
            pc.oniceconnectionstatechange = () => {
                console.log("oniceconnectionstatechange", pc?.iceConnectionState)
            }
            pc.onconnectionstatechange = () => {
                console.log("onconnectionstatechange", pc?.connectionState)
                let connectionState = pc?.connectionState
                if (connectionState === 'connected') {
                    _onConnected()
                } else if (connectionState === 'disconnected') {
                    _onDisconnected()
                }
            }
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log("New ICE candidate:", event.candidate);
                } else {
                    console.log("All ICE candidates have been sent.");
                }
            };
        }

        const _onConnecting = (mode) => {
            const modeText = mode === 'appointment' ? 'Appointment Bot' : 'General Assistant'
            statusEl.textContent = `Connecting to ${modeText}...`
            updateButtonStates(true)
            connected = true
        }

        const _onConnected = () => {
            const modeText = currentMode === 'appointment' ? 'Appointment Bot' : 'General Assistant'
            statusEl.textContent = `Connected to ${modeText}`
            updateButtonStates(true)
            connected = true
        }

        const _onDisconnected = () => {
            statusEl.textContent = "Disconnected"
            updateButtonStates(false)
            connected = false
            currentMode = null
        }

        const updateButtonStates = (isConnected) => {
            if (isConnected) {
                buttonEl.textContent = "Disconnect"
                buttonEl.className = "disconnect-btn"
                appointmentBtn.disabled = true
                appointmentBtn.style.opacity = "0.5"
            } else {
                buttonEl.textContent = "Connect (General Assistant)"
                buttonEl.className = "general-btn"
                appointmentBtn.disabled = false
                appointmentBtn.style.opacity = "1"
            }
        }

        const disconnect = () => {
            if (!peerConnection) {
                return
            }
            peerConnection.close()
            peerConnection = null
            _onDisconnected()
        }

        buttonEl.addEventListener("click", async () => {
            if (!connected) {
                await connect('general')
            } else {
                disconnect()
            }
        });

        appointmentBtn.addEventListener("click", async () => {
            if (!connected) {
                await connect('appointment')
            }
        });
    </script>
</body>
</html>
